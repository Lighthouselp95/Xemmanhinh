<!DOCTYPE html>
<html lang="vi">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

  <meta http-equiv="Expires" content="0">

<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Screen Viewer H264</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  overflow: hidden;
  touch-action: manipulation;
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: #fff;
  overscroll-behavior: none;
}
#video-container {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  touch-action: none;
}
#video-wrapper {
  position: absolute;
  top: 50%; left: 50%;
  transform-origin: center center;
  transition: none;
  width: max-content;
  height: max-content;
  touch-action: none;
  will-change: transform;
}
#video-container canvas {
  display: block;
  touch-action: none;
  image-rendering: auto;
  image-rendering: -webkit-optimize-contrast;
}
#status-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
  padding: 8px 16px; display: flex; align-items: center; gap: 12px;
  font-size: 13px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.4s ease;
}
#status-bar.visible { opacity: 1; pointer-events: auto; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.status-dot.connected { background: #00e676; box-shadow: 0 0 6px #00e676; }
.status-dot.disconnected { background: #ff5252; box-shadow: 0 0 6px #ff5252; }
.status-dot.connecting { background: #ffc107; box-shadow: 0 0 6px #ffc107; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.4; } }
#fps-counter { margin-left: auto; color: #aaa; font-variant-numeric: tabular-nums; }
#stats { color: #888; font-size: 11px; }
#bottom-bar {
  position: fixed; bottom: 14px; left: 0; right: 0; z-index: 101;
  background: transparent; backdrop-filter: none;
  padding: 6px 6px; display: flex; align-items: center; justify-content: space-between;
  opacity: 0; pointer-events: none; touch-action: none;
  height: 0; overflow: visible;
}
#bottom-bar > *, #bottom-bar .bottom-left *, #bottom-bar .bottom-right * {
  opacity: 1 !important; pointer-events: auto !important; cursor: pointer;
  position: relative; z-index: 102;
}
#bottom-bar .bottom-left, #bottom-bar .bottom-right {
  display: flex; flex-direction: row; align-items: center; gap: 8px;
}
#arrow-toggle {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1;
  color: rgba(255,255,255,0.85);
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  transition: opacity 0.3s ease, background 0.2s;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none;
  appearance: none;
  outline: none;
  box-shadow: none;
  -webkit-user-select: none;
  user-select: none;
  touch-callout: none;
  -webkit-touch-callout: none;
}
#arrow-toggle:hover { background: rgba(255,255,255,0.22); }
#arrow-toggle:active { background: rgba(255,255,255,0.12); transform: none; }
#arrow-toggle:focus { outline: none; box-shadow: none; }
#arrow-toggle:focus-visible { outline: none; box-shadow: none; }
#arrow-toggle.open { transform: rotate(180deg); background: rgba(255,255,255,0.3); }
#btn-keyboard-float {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.85);
  font-size: 14px; line-height: 1;
  cursor: pointer;
  transition: all 0.2s;
  touch-action: none;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none;
  appearance: none;
  outline: none;
  box-shadow: none;
  touch-callout: none;
  -webkit-touch-callout: none;
}
#btn-keyboard-float:hover { background: rgba(255,255,255,0.22); }
#btn-keyboard-float:active { background: rgba(255,255,255,0.12); }
#btn-keyboard-float:focus { outline: none; box-shadow: none; }
#btn-keyboard-float:focus-visible { outline: none; box-shadow: none; }
#btn-keyboard-float.active { background: rgba(0,230,118,0.3); color: #00e676; }
#control-panel {
  position: fixed; bottom: 54px; left: 0; right: 0; z-index: 100;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
  padding: 12px 16px; display: flex; align-items: center; justify-content: center; gap: 12px;
  transform: translateY(120%); transition: transform 0.3s ease, visibility 0.3s;
  visibility: hidden; pointer-events: none; touch-action: none;
}
#control-panel.show { transform: translateY(0); visibility: visible; pointer-events: auto; }
.toolbar-btn {
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
  color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer;
  font-size: 13px; transition: all 0.2s; white-space: nowrap;
  user-select: none; -webkit-user-select: none; -ms-user-select: none;
}
.toolbar-btn:hover { background: rgba(255,255,255,0.25); }
.toolbar-btn.active { background: #00e676; color: #000; border-color: #00e676; }
.key-btn.armed { background: #000; color: #00e676; border-color: #00e676; font-weight: bold; }
.key-btn.pending { background: #ffb300; color: #000; border-color: #ffb300; font-weight: bold; }
#combo-display { text-align:center; margin-bottom:8px; color:#00e676; font-size:14px; min-height:18px; }
#settings-panel {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: #16213e; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding: 24px; z-index: 200; min-width: 300px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5); display: none;
  pointer-events: auto; touch-action: none;
}
#settings-panel.show { display: block; }
#settings-panel h3 { margin-bottom: 16px; font-size: 16px; }
.setting-row { margin-bottom: 12px; }
.setting-row label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
.setting-row input {
  width: 100%; padding: 8px 12px; background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
  color: #fff; font-size: 14px; outline: none;
}
.setting-row input:focus { border-color: #00e676; }
.settings-actions { display: flex; gap: 8px; margin-top: 16px; }
#keyboard-panel {
  display:none; position:fixed;   bottom:54px; left:0; right:0; z-index:150;
  background:rgba(0,0,0,0.85); padding:10px 8px 12px; max-height:42vh; overflow-y:auto;
  pointer-events:auto; touch-action:none;
}
#keyboard-panel.show { display:block; }
#keyboard-toggle-btn {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.85);
  font-size: 14px; line-height: 1;
  cursor: pointer; backdrop-filter: none;
  transition: all 0.2s;
  pointer-events: auto; touch-action: none;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  outline: none;
  -webkit-user-select: none;
  user-select: none;
}
#keyboard-toggle-btn:hover { background: rgba(255,255,255,0.25); }
#keyboard-toggle-btn:active { background: rgba(255,255,255,0.12); }
#keyboard-toggle-btn:focus { outline: none; background: rgba(255,255,255,0.12); }
.key-grid { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
#codec-badge {
  position: fixed; top: 8px; right: 8px; z-index: 102;
  background: rgba(0,150,0,0.8); border-radius: 6px;
  padding: 4px 10px; font-size: 11px; font-weight: bold;
  pointer-events: none; opacity: 0; transition: opacity 0.3s;
}
#codec-badge.visible { opacity: 1; }
</style>
</head>
<body>

<!-- Hidden input: mobile keyboard hiện lên khi focus, không hiện UI -->
<input id="hidden-input" type="text"
  autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
  style="position:fixed; top:0; left:0; width:1px; height:1px; opacity:0.01; pointer-events:none; border:none; outline:none; background:transparent; z-index:-1;">

<script src="broadway-decoder.js"></script>
<script src="broadway-yuv.js"></script>
<script src="broadway-player.js"></script>
<script>
const container = document.getElementById('video-container');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const fpsCounter = document.getElementById('fps-counter');
const statsEl = document.getElementById('stats');
const statusBar = document.getElementById('status-bar');
const arrowToggle = document.getElementById('arrow-toggle');
const controlPanel = document.getElementById('control-panel');
const btnCtrl = document.getElementById('btn-ctrl');
const btnFullscreen = document.getElementById('btn-fullscreen');
const btnSettings = document.getElementById('btn-settings');
const btnKeyboard = document.getElementById('btn-keyboard-float');
// const btnFocusTarget = document.getElementById('btn-focus-target');  // Đã bỏ typing area
const settingsPanel = document.getElementById('settings-panel');
const keyboardPanel = document.getElementById('keyboard-panel');
const hiddenInput = document.getElementById('hidden-input');
// const typingArea = document.getElementById('typing-area');  // Đã bỏ typing area
// const typeInput = document.getElementById('type-input');     // Đã bỏ typing area
const codecBadge = document.getElementById('codec-badge');

let controlEnabled = true;
btnCtrl.textContent = 'Control: ON';
btnCtrl.classList.add('active');
let screenInfo = { width: 1920, height: 1080, scale: 100 };
let frameCount = 0;
let lastFpsTime = Date.now();
let serverUrl = '';

// ── H.264 Decoder (WebCodecs + Broadway fallback) ────────────
let canvas = null;
let ctx2d = null;
let videoDecoder = null;
let decoderConfigured = false;
let decoderReady = false;
let _isConfiguring = false;
let _pendingKeyframe = null;
let decodedCount = 0;
let decodeCount = 0;
let cachedSPS = null;
let cachedPPS = null;
let tsUs = 0;
let frameIntervalUs = 1000000 / 45;  // 45fps mặc định; sẽ lấy fps thật từ server (init msg)
let decoderMode = null;
let bwayPlayer = null;

function parseAnnexBNALs(data) {
  const nals = [];
  let i = 0;
  const len = data.length;
  while (i < len - 3) {
    if (data[i] === 0 && data[i + 1] === 0) {
      let scLen = 0;
      if (data[i + 2] === 1) scLen = 3;
      else if (data[i + 2] === 0 && i + 3 < len && data[i + 3] === 1) scLen = 4;
      if (scLen > 0) {
        let end = len;
        for (let j = i + scLen + 1; j < len - 3; j++) {
          if (data[j] === 0 && data[j + 1] === 0 &&
              (data[j + 2] === 1 || (data[j + 2] === 0 && j + 3 < len && data[j + 3] === 1))) {
            end = j;
            break;
          }
        }
        nals.push({ type: data[i + scLen] & 0x1f, start: i, end: end, scLen: scLen });
        i = end;
      } else { i++; }
    } else { i++; }
  }
  return nals;
}

function buildAvcC(sps, pps) {
  const spsLen = sps.length;
  const ppsLen = pps.length;
  const box = new Uint8Array(5 + 1 + 3 + 1 + 2 + spsLen + 1 + 2 + ppsLen);
  let off = 0;
  box[off++] = 0x01;
  box[off++] = sps[1];
  box[off++] = sps[2];
  box[off++] = sps[3];
  box[off++] = 0xff;
  box[off++] = 0xe1;
  box[off++] = (spsLen >> 8) & 0xff;
  box[off++] = spsLen & 0xff;
  box.set(sps, off); off += spsLen;
  box[off++] = 0x01;
  box[off++] = (ppsLen >> 8) & 0xff;
  box[off++] = ppsLen & 0xff;
  box.set(pps, off);
  return box;
}

function getCodecString(sps) {
  if (!sps || sps.length < 4) {
    console.warn('[DEC] Invalid SPS, using default avc1.64001f');
    return 'avc1.64001f';
  }
  const p = sps[1];
  const c = sps[2];
  const l = sps[3];
  return 'avc1.' + p.toString(16).padStart(2,'0') + c.toString(16).padStart(2,'0') + l.toString(16).padStart(2,'0');
}

function annexBToAVCC(data, nals) {
  const skipTypes = new Set([7, 8, 6]);
  let totalLen = 0;
  const nalDatas = [];
  for (const nal of nals) {
    if (skipTypes.has(nal.type)) continue;
    const nalu = data.slice(nal.start + nal.scLen, nal.end);
    nalDatas.push(nalu);
    totalLen += 4 + nalu.length;
  }
  const out = new Uint8Array(totalLen);
  let off = 0;
  for (const nalu of nalDatas) {
    out[off++] = (nalu.length >> 24) & 0xff;
    out[off++] = (nalu.length >> 16) & 0xff;
    out[off++] = (nalu.length >> 8) & 0xff;
    out[off++] = nalu.length & 0xff;
    out.set(nalu, off);
    off += nalu.length;
  }
  return out;
}

function initDecoder(width, height) {
  cleanupDecoder();
  console.log('[DEC] initDecoder', width, 'x', height, 'WebCodecs:', 'VideoDecoder' in window, 'Player:', typeof Player);

  // ===== 1. WEBCODECS (hardware decode, ưu tiên) =====
  if ('VideoDecoder' in window) {
    try {
      videoDecoder = new VideoDecoder({
        output: (frame) => {
          decodedCount++;
          // console.log('[WC] decoded frame', frame.displayWidth, 'x', frame.displayHeight, '#', decodedCount); // TODO: bật lại khi debug video
          renderFrame(frame.displayWidth, frame.displayHeight, (ctx) => ctx.drawImage(frame, 0, 0));
          frame.close();
        },
        error: (e) => {
          console.error('[WC] Decoder error:', e.message);
          sendDebug('wc_error', { msg: e.message });
          requestRemoteKeyframe();
        }
      });
      decoderMode = 'webcodecs';
      return true;
    } catch(e) { console.warn('[WC] init failed:', e.message); }
  }

  // ===== 2. BROADWAY (software decode, fallback) =====
  if (typeof Player !== 'undefined') {
    try {
      bwayPlayer = new Player({ useWorker: true, sliceMode: true, sliceNum: 0, size: { width, height } });
      canvas = bwayPlayer.canvas;
      canvas.style.backgroundColor = '#0a0a1a';
      canvas.style.cursor = 'crosshair';
      container.querySelector('#video-wrapper').appendChild(canvas);
      ctx2d = null;
      bwayPlayer.onPictureDecoded = function(buffer, width, height, infos) {
        decodedCount++;
      };
      decoderMode = 'broadway';
      setupCanvasEvents();
      fitCanvas();
      return true;
    } catch(e) { console.error('[BRO] init failed:', e.message); }
  }

  console.error('[DEC] No decoder available');
  return false;
}

function cleanupDecoder() {
  if (videoDecoder) {
    try {
      if (videoDecoder.state !== 'closed') videoDecoder.close();
    } catch(e) {}
  }
  videoDecoder = null;
  decoderConfigured = false;
  decoderReady = false;
  _isConfiguring = false;
  _pendingKeyframe = null;
  if (bwayPlayer && canvas && canvas.parentNode) {
    try { canvas.parentNode.removeChild(canvas); } catch(e) {}
  }
  bwayPlayer = null;
  // KHÔNG remove canvas khỏi DOM để giữ lại frame cuối, tránh màn hình đen khi tab ẩn/hiện hoặc reconnect
  decodedCount = 0;
  decodeCount = 0;
  tsUs = 0;
}

function renderFrame(w, h, drawFn) {
  if (decoderMode === 'webcodecs') {
    if (!canvas || !canvas.parentNode) {
      canvas = container.querySelector('#video-wrapper canvas');
      if (!canvas) {
        canvas = document.createElement('canvas');
        canvas.style.backgroundColor = '#0a0a1a';
        canvas.style.cursor = controlEnabled ? 'crosshair' : 'default';
        container.querySelector('#video-wrapper').appendChild(canvas);
      }
      ctx2d = canvas.getContext('2d', { desynchronized: true });
      setupCanvasEvents();
    }
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      fitCanvas();
    }
    drawFn(ctx2d);
    document.getElementById('stats').textContent = w + 'x' + h + ' #' + decodedCount;
  }
}

async function configureDecoder(sps, pps, width, height) {
  if (!videoDecoder || _isConfiguring) return;
  _isConfiguring = true;
  const desc = buildAvcC(sps, pps);
  // console.log('[WC] SPS:', sps ? sps.length : 0, 'bytes, PPS:', pps ? pps.length : 0, 'bytes, desc:', desc ? desc.length : 0, 'bytes');
  // console.log('[WC] Codec string from SPS:', getCodecString(sps));
  // Thử nhiều codec + hardware config
  const codecs = [
    getCodecString(sps),
    'avc1.42001f',
    'avc1.42001e',
    'avc1.4d001f',
    'avc1.64001f',
    'avc1.42e01f',
  ];
  const hwOpts = [
    { hardwareAcceleration: 'prefer-hardware' },
    { hardwareAcceleration: 'no-preference' },
    {},
  ];
  const unique = [...new Set(codecs)];
  try {
    for (const hw of hwOpts) {
      for (const codec of unique) {
        if (!videoDecoder) break;
        const config = {
          codec: codec,
          codedWidth: width,
          codedHeight: height,
          description: desc,
          latencyMode: 'realtime',
          optimizeForLatency: true,
          ...hw,
        };
        try {
          const supported = await VideoDecoder.isConfigSupported(config);
          if (supported.supported && videoDecoder) {
            videoDecoder.configure(config);
            decoderConfigured = true;
            decoderReady = false;
            console.log('[WC] Configured:', codec, hw.hardwareAcceleration || 'no-hw');
            _isConfiguring = false;
            if (_pendingKeyframe) {
              const kf = _pendingKeyframe;
              _pendingKeyframe = null;
              decodeFrame(kf);
            } else {
              requestRemoteKeyframe(true);
            }
            return;
          }
        } catch(e) {}
      }
    }
    console.error('[WC] No supported codec found');
    sendDebug('wc_no_codec', {});
    decoderMode = null;
  } finally {
    _isConfiguring = false;
  }
}

function decodeFrame(data) {
  if (decoderMode === 'webcodecs') {
    if (!videoDecoder) return;
    const nals = parseAnnexBNALs(data);
    const isKey = nals.some(n => n.type === 5);
    if (!decoderConfigured || _isConfiguring) {
      if (isKey) _pendingKeyframe = data;
      requestRemoteKeyframe();
      return;
    }
    const avcc = annexBToAVCC(data, nals);
    if (avcc.length === 0) { requestRemoteKeyframe(); return; }

    // Giới hạn hàng đợi decode nội bộ → nếu decoder chậm hơn mạng thì DROP frame delta
    // mới thay vì để hàng đợi trượt tăng (giữ độ trễ ổn định, tránh trễ tích lũy).
    // KHÔNG drop keyframe: khi queue đầy mà gặp keyframe thì reset queue để decode lại sạch
    // (tránh "kẹt trắng màn hình" khi vào lại tab — queue giữ đầy làm mọi frame bị vứt).
    if (videoDecoder.decodeQueueSize > 4) {
      if (!isKey) return;
      videoDecoder.reset();
      decoderReady = false;
    }
    // Sau configure, PHẢI nhận keyframe trước khi decode được
    if (!isKey && !decoderReady) {
      requestRemoteKeyframe();
      return;
    }
    try {
      videoDecoder.decode(new EncodedVideoChunk({
        type: isKey ? 'key' : 'delta',
        timestamp: tsUs,
        data: avcc,
      }));
      decoderReady = true;
      tsUs += frameIntervalUs;
    } catch (e) {
      if (decodeCount <= 3) console.error('[WC] decode error:', e.message);
      requestRemoteKeyframe();
    }
  } else if (decoderMode === 'broadway' && bwayPlayer) {
    try { bwayPlayer.decode(data); } catch(e) { console.error('[BRO] decode error:', e); sendDebug('bway_error', { msg: String(e) }); }
  }
}

function fitCanvas() {
  if (!canvas) return;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const cw = screenInfo.width;
  const ch = screenInfo.height;
  const aspect = cw / ch;
  let dw, dh;
  if (aspect > vw / vh) { dw = vw; dh = vw / aspect; }
  else { dh = vh; dw = vh * aspect; }
  canvas.style.width = dw + 'px';
  canvas.style.height = dh + 'px';
  fitW = dw; fitH = dh;   // lưu kích thước vùa khét (zoom=1) để clampPan dùng
  _cachedRect = null;  // Invalidate cache khi resize
  if (!userZoomed) { currentZoom = 1; panX = 0; panY = 0; }
  clampPan();
  applyZoom();
}

// ── Audio: PCM raw via ScriptProcessorNode ──
let audioCtx = null;
let audioPkts = 0;
let audioBytes = 0;
let audioNode = null;        // AudioWorkletNode
let audioStarted = false;
let AUDIO_SRC_RATE = 48000;  // sample rate of PCM sent by server (set from init msg)
const SAMPLE_RATE = 48000;
const CHANNELS = 2;
const RING_SAMPLES = SAMPLE_RATE * 0.5;   // 0.5s ring-buffer (đủ nuốt jitter nhỏ, giảm trễ)
const PREBUFFER_SAMPLES = SAMPLE_RATE * 0.02;  // ~20ms trước khi phát (giảm trễ, vẫn mượt)
const audioIndicator = document.getElementById('audio-indicator');

// Ring-buffer chia sẻ main-thread ↔ worklet (Float32 interleaved L/R)
let ringBuf = null;
let ringWrite = 0;
let ringRead = 0;
let ringFilled = 0;

// ── AudioWorklet (chạy trên audio-thread riêng, mát hơn main-thread) ──
// Có fallback ScriptProcessorNode nếu trình duyệt không hỗ trợ AudioWorklet.
let audioWorkletReady = false;
let pendingPCM = [];   // đệm PCM chờ worklet sẵn sàng

const PCM_WORKLET_SRC = `
class PCMPlayer extends AudioWorkletProcessor {
  constructor() {
    super();
    this.cap = Math.floor(sampleRate * 0.5) * 2;
    this.ring = new Float32Array(this.cap);
    this.w = 0; this.r = 0; this.filled = 0;
    this.prebuffer = Math.floor(sampleRate * 0.03) * 2;
    this.started = false;
        this.port.onmessage = (e) => {
          const data = e.data; const n = data.length;
          for (let i = 0; i < n; i++) {
            this.ring[this.w] = data[i];
            this.w = (this.w + 1) % this.cap;
            if (this.filled >= this.cap) {
              // Ring đầy, loại bỏ data cũ để consumer không đọc lại (echo)
              this.r = (this.r + 1) % this.cap;
            } else {
              this.filled++;
            }
          }
        };
  }
  process(_inputs, outputs) {
    const out = outputs[0]; const L = out[0], R = out[1];
    if (!L) return true;
    if (!this.started && this.filled >= this.prebuffer) this.started = true;
    for (let i = 0; i < L.length; i++) {
      if (this.started && this.filled >= 2) {
        L[i] = this.ring[this.r];
        R[i] = this.ring[(this.r + 1) % this.cap];
        this.r = (this.r + 2) % this.cap;
        this.filled -= 2;
      } else { L[i] = 0; R[i] = 0; }
    }
    return true;
  }
}
registerProcessor('pcm-player', PCMPlayer);
`;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)(); // Native sampleRate
  const actualRate = audioCtx.sampleRate;
  console.log('[AUDIO] Browser sampleRate:', actualRate);
  ringBuf = new Float32Array(RING_SAMPLES);
  ringWrite = new Int32Array(1); ringRead = new Int32Array(1); ringFilled = new Int32Array(1);
  audioCtx.resume().then(() => console.log('[AUDIO] Context resumed')).catch(() => {});

  if (audioCtx.audioWorklet) {
    try {
      const url = URL.createObjectURL(new Blob([PCM_WORKLET_SRC], { type: 'application/javascript' }));
      audioCtx.audioWorklet.addModule(url).then(() => {
        audioNode = new AudioWorkletNode(audioCtx, 'pcm-player', { outputChannelCount: [2] });
        audioNode.connect(audioCtx.destination);
        audioWorkletReady = true;
        for (const pcm of pendingPCM) audioNode.port.postMessage(pcm);
        pendingPCM = [];
        console.log('[AUDIO] AudioWorklet initialized');
      }).catch((e) => { console.warn('[AUDIO] Worklet failed, fallback SP:', e); initScriptProcessor(); });
    } catch (e) { console.warn('[AUDIO] Worklet error, fallback SP:', e); initScriptProcessor(); }
  } else {
    initScriptProcessor();
  }
}

// Fallback: ScriptProcessorNode (deprecated, chạy trên main-thread)
function initScriptProcessor() {
  audioNode = audioCtx.createScriptProcessor(4096, 2, 2);
  audioNode.onaudioprocess = function(e) {
    const out = e.outputBuffer;
    const L = out.getChannelData(0);
    const R = out.getChannelData(1);
    const ring = ringBuf, cap = ring.length;
    const r = Atomics.load(ringRead, 0);
    let filled = Atomics.load(ringFilled, 0);
    for (let i = 0; i < L.length; i++) {
      if (filled >= 2) {
        L[i] = ring[(r + i*2) % cap];
        R[i] = ring[(r + i*2 + 1) % cap];
      } else { L[i] = 0; R[i] = 0; }
    }
    Atomics.store(ringRead, 0, (r + L.length * 2) % cap);
    Atomics.store(ringFilled, 0, Math.max(0, filled - L.length * 2));
  };
  audioNode.connect(audioCtx.destination);
  console.log('[AUDIO] ScriptProcessorNode initialized, buffer:', audioNode.bufferSize);
}

function playPCMChunk(raw) {
  audioBytes += raw.length;
  const samples = new Int16Array(raw.buffer, raw.byteOffset, raw.length / 2);
  if (samples.length === 0) return;
  const SRC_RATE = AUDIO_SRC_RATE;  // actual sample rate from server (init msg)
  const DST_RATE = audioCtx ? audioCtx.sampleRate : 48000;
  const pcm = new Float32Array(samples.length);
  for (let i = 0; i < samples.length; i++) pcm[i] = samples[i] / 32768;

  // Resample nếu sample rate khác
  let output = pcm;
  if (DST_RATE !== SRC_RATE) {
    const ratio = SRC_RATE / DST_RATE;
    const outLen = Math.floor(samples.length / ratio);
    output = new Float32Array(outLen);
    for (let i = 0; i < outLen; i++) {
      const srcIdx = i * ratio;
      const idx = Math.floor(srcIdx);
      const frac = srcIdx - idx;
      const next = Math.min(idx + 1, samples.length - 1);
      output[i] = pcm[idx] * (1 - frac) + pcm[next] * frac;
    }
  }

  if (audioWorkletReady && audioNode && audioNode.port) {
    audioNode.port.postMessage(output);
  } else if (audioNode && audioNode.onaudioprocess) {
    const ring = ringBuf, cap = ring.length;
    const w = Atomics.load(ringWrite, 0);
    let filled = Atomics.load(ringFilled, 0);
    for (let i = 0; i < output.length && filled < cap; i++) ring[(w + i) % cap] = output[i];
    Atomics.store(ringWrite, 0, (w + output.length) % cap);
    Atomics.store(ringFilled, 0, Math.min(cap, filled + output.length));
  } else {
    // Worklet chưa kịp sẵn sàng → đệm lại (tránh mất audio lúc đầu)
    pendingPCM.push(output);
    if (pendingPCM.length > 200) pendingPCM.shift();
  }
}

// ── WebSocket ─────────────────────────────────────────────────
let ws = null;
let audioWs = null;
let lastDataTime = Date.now();   // thời điểm nhận dữ liệu cuối (phát hiện WS chết thầm)
let _wsClosing = false;          // đang trong quá trình đóng WS cũ
let _connectTimer = null;        // timer reconnect duy nhất, tránh race condition

// Smart reconnect: exponential backoff + tạm dừng khi tab ẩn
let _reconnectAttempt = 0;       // số lần thử lại liên tiếp
const RECONNECT_BASE_MS = 1000;  // bắt đầu 1s
const RECONNECT_MAX_MS = 30000;  // tối đa 30s
const RECONNECT_BACKOFF = 2;     // nhân đôi mỗi lần

// Xin keyframe từ server (để tự phục hồi khi bị sọc do rớt frame / mất tham chiếu)
let _lastKfReq = 0;
function requestRemoteKeyframe(force = false) {
  const now = Date.now();
  if (!force && now - _lastKfReq < 1000) return;   // throttle 1s tránh spam
  _lastKfReq = now;
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'request_keyframe' }));
}

function sendDebug(evt, extra) {
  try {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(Object.assign({ type: 'debug_state', evt: evt }, extra || {})));
  } catch(e) {}
  try { console.log('[DBG]', evt, extra || ''); } catch(e) {}
}

const WS_SCHEME = window.location.protocol === 'https:' ? 'wss' : 'ws';

function getServerUrl() {
  return localStorage.getItem('server_url_h264wss') || `${WS_SCHEME}://${window.location.hostname}:8766`;
}

function getAudioUrl() {
  const base = localStorage.getItem('server_url_h264wss') || `${WS_SCHEME}://${window.location.hostname}:8766`;
  return base.replace(/:(\d+)$/, ':8767');
}

function setStatus(state, text) {
  statusDot.className = 'status-dot ' + state;
  statusText.textContent = text;
}

// Reconnect an toàn: đảm bảo chỉ 1 timer chạy, WS cũ đóng hẳn trước khi tạo mới
function scheduleReconnect(delayMs) {
  if (_connectTimer) { clearTimeout(_connectTimer); _connectTimer = null; }
  // Không tự reconnect khi tab bị ẩn (tiết kiệm tài nguyên, tránh nối/ngắt liên tục)
  if (document.hidden) return;
  const delay = (delayMs != null) ? delayMs : Math.min(RECONNECT_BASE_MS * Math.pow(RECONNECT_BACKOFF, _reconnectAttempt), RECONNECT_MAX_MS);
  _connectTimer = setTimeout(() => { _connectTimer = null; connect(); }, delay);
}

function connectAudio() {
  initAudio(); // Initialize AudioContext on user gesture
  // Không đóng audio WS đang khỏe — chỉ tạo mới khi cũ đã đóng/missing
  if (audioWs && audioWs.readyState === WebSocket.OPEN) {
    return;
  }
  if (audioWs && audioWs.readyState <= 1) audioWs.close();
  audioWs = new WebSocket(getAudioUrl());
  audioWs.binaryType = 'arraybuffer';
  audioWs.onopen = () => console.log('[AUDIO-WS] Connected to', getAudioUrl());
  audioWs.onmessage = (evt) => {
    if (evt.data instanceof ArrayBuffer) {
      const data = new Uint8Array(evt.data);
      if (data[0] === 0x02) {

        playPCMChunk(data.slice(1));
      }
    }
  };
  // Reconnect audio nhanh (5s) — tránh mất âm thanh kéo dài khi WS audio rớt
  audioWs.onclose = (e) => { console.log('[AUDIO-WS] Closed:', e.code, e.reason); setTimeout(() => { if (!document.hidden && !(audioWs && audioWs.readyState === WebSocket.OPEN)) connectAudio(); }, 5000); };
  audioWs.onerror = (e) => console.error('[AUDIO-WS] Error:', e, e.type);
}

let broadwayReady = false;
let broadwayBuffer = [];

let _wsCloseRescue = null;         // timeout cứu hộ nếu onclose không bao giờ fire

function connect() {
  // Đợi WS cũ đóng hẳn trước khi tạo mới (tránh handshake fail do race condition)
  if (ws && ws.readyState <= 2) {  // CONNECTING(0), OPEN(1), CLOSING(2)
    if (_wsClosing) return;        // đang đóng, đợi onclose gọi connect
    _wsClosing = true;
    const oldWs = ws;
    ws = null;
    oldWs.onclose = () => {
      if (_wsCloseRescue) { clearTimeout(_wsCloseRescue); _wsCloseRescue = null; }
      _wsClosing = false;
      connect();
    };
    oldWs.close();
    // CỨU HỘ: nếu onclose không bao giờ fire (socket chết lặng khi tab ẩn lâu),
    // tự reset sau 3s để không kẹt _wsClosing=true mãi → màn hình đen không hồi phục.
    _wsCloseRescue = setTimeout(() => {
      _wsCloseRescue = null;
      if (_wsClosing) {
        _wsClosing = false;
        console.warn('[WS] onclose không fire, ép reconnect (rescue)');
        connect();
      }
    }, 3000);
    return;
  }
  _wsClosing = false;
  if (_connectTimer) { clearTimeout(_connectTimer); _connectTimer = null; }
  serverUrl = getServerUrl();
  setStatus('connecting', 'Connecting...');
  ws = new WebSocket(serverUrl);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    _reconnectAttempt = 0;   // nối thành công → reset backoff
    sendDebug('open');
    setStatus('connected', 'Connected');
    connectAudio();
    showUI();
    // Request keyframe on connect
    requestKeyframe();
  };

  let lastScreenWidth = 0;
  let lastScreenHeight = 0;

  function requestKeyframe() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'request_keyframe' }));
    }
  }

    lastDataTime = Date.now();   // có bất kỳ dữ liệu nào (video/pong/json) → còn sống
    if (evt.data instanceof ArrayBuffer) {
      const data = new Uint8Array(evt.data);
      const type = data[0];
      const payload = data.slice(1);
      
      if (type === 0x03) {
        // SPS/PPS header packet từ server
        const nals = parseAnnexBNALs(payload);
        for (const nal of nals) {
          if (nal.type === 7) { cachedSPS = payload.slice(nal.start + nal.scLen, nal.end); }
          if (nal.type === 8) { cachedPPS = payload.slice(nal.start + nal.scLen, nal.end); }
        }
        if (decoderMode === 'webcodecs' && !decoderConfigured && !_isConfiguring && cachedSPS && cachedPPS) {
          configureDecoder(cachedSPS, cachedPPS, screenInfo.width, screenInfo.height);
        }
        return;
      }

      if (type === 0x01) {
        decodeCount++;
        // console.log('[WS] Video frame:', payload.length, 'bytes, decoderMode:', decoderMode); // TODO: bật lại khi debug video
        if (!decoderMode) {
          return;
        }
        const nals = parseAnnexBNALs(payload);
        let hasSPS = false, hasPPS = false, hasIDR = false;
        for (const nal of nals) {
          if (nal.type === 7) { cachedSPS = payload.slice(nal.start + nal.scLen, nal.end); hasSPS = true; }
          if (nal.type === 8) { cachedPPS = payload.slice(nal.start + nal.scLen, nal.end); hasPPS = true; }
          if (nal.type === 5) hasIDR = true;
        }
        if (decoderMode === 'webcodecs') {
          if (!decoderConfigured && !_isConfiguring && cachedSPS && cachedPPS) {
            if (hasIDR) _pendingKeyframe = payload;
            configureDecoder(cachedSPS, cachedPPS, screenInfo.width, screenInfo.height);
            return;
          }
          if (_isConfiguring) {
            if (hasIDR) _pendingKeyframe = payload;
            return;
          }
        } else if (decoderMode === 'broadway') {
          if (!broadwayReady) {
            if (hasSPS && hasPPS && hasIDR) {
              broadwayReady = true;
              broadwayBuffer = [];
            } else {
              broadwayBuffer.push(payload);
              if (broadwayBuffer.length > 30) broadwayBuffer.shift();
              return;
            }
          }
        }
        decodeFrame(payload);
      }
      return;
    }

    try {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'init') {
        screenInfo = { width: msg.width, height: msg.height, scale: 100 };
        if (msg.fps) frameIntervalUs = 1000000 / msg.fps;
        decoderConfigured = false;
        if (msg.audio_sample_rate) AUDIO_SRC_RATE = msg.audio_sample_rate;
        const ok = initDecoder(msg.width, msg.height);
        sendDebug('init_result', { ok: !!ok, mode: decoderMode, webcodecs: 'VideoDecoder' in window });
        if (!ok) return;
        setStatus('connected', `Connected (${msg.width}x${msg.height} ${decoderMode})`);
        codecBadge.textContent = decoderMode === 'webcodecs' ? 'H.264 WebCodecs + PCM' : 'H.264 Broadway + PCM';
        codecBadge.classList.add('visible');
        lastScreenWidth = msg.width;
        lastScreenHeight = msg.height;
      } else if (msg.type === 'screen_info') {
        // Screen resolution changed - request new keyframe
        if (msg.width !== lastScreenWidth || msg.height !== lastScreenHeight) {
          lastScreenWidth = msg.width;
          lastScreenHeight = msg.height;
          requestKeyframe();
        }
        screenInfo = msg;
      }
    } catch (e) {}
  };

  ws.onclose = (evt) => {
    _reconnectAttempt++;   // tăng backoff cho lần thử sau
    sendDebug('ws_close', { code: (evt && evt.code) || '', reason: (evt && evt.reason) || '' });
    setStatus('disconnected', 'Disconnected - Reconnecting...');
    codecBadge.classList.remove('visible');
    showUI();
    // Thả hết modifier đang giữ khi mất kết nối (tránh kẹt phím ở server)
    if (armedMods.size > 0) resetCombo();
    // GIỮ canvas frame cuối (không xóa decoder) → màn hình không đen khi mất kết nối
    // Nếu _wsClosing=true, connect() sẽ được gọi từ hàm đóng cũ
    if (!_wsClosing) scheduleReconnect();

    // visibilitychange sẽ nối lại ngay với delay thấp nhất.
    if (document.hidden) _reconnectAttempt = 0;
  };
  ws.onerror = () => setStatus('disconnected', 'Error');
}

setInterval(() => {
  const elapsed = (Date.now() - lastFpsTime) / 1000;
  fpsCounter.textContent = Math.round(decodedCount / elapsed) + ' FPS';

}, 1000);

// ── Coordinate mapping ────────────────────────────────────────
let _cachedRect = null;
let _cachedRectTime = 0;
function getCachedRect() {
  const now = Date.now();
  // Cache 100ms để tránh gọi getBoundingClientRect quá nhiều
  if (!_cachedRect || now - _cachedRectTime > 100) {
    _cachedRect = canvas.getBoundingClientRect();
    _cachedRectTime = now;
  }
  return _cachedRect;
}
function toServerCoords(clientX, clientY) {
  const rect = getCachedRect();
  const pw = screenInfo.width || canvas.width;
  const ph = screenInfo.height || canvas.height;
  const px = ((clientX - rect.left) / rect.width) * pw;
  const py = ((clientY - rect.top) / rect.height) * ph;
  const factor = screenInfo.scale / 100;
  return {
    px: Math.round(Math.max(0, Math.min(pw, px))),
    py: Math.round(Math.max(0, Math.min(ph, py))),
    x: Math.round(Math.max(0, Math.min(pw, px)) / factor),
    y: Math.round(Math.max(0, Math.min(ph, py)) / factor),
  };
}
function sendMsg(data) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(data));
}

// ── Throttled mouse move ──────────────────────────────────────
let lastMoveSent = 0;
let pendingMove = null;
const MOVE_INTERVAL = 33;
function sendMouseMove(px, py, x, y) {
  remoteCursor = { px, py, x, y, visible: true };
  const now = Date.now();
  if (now - lastMoveSent >= MOVE_INTERVAL) {
    lastMoveSent = now;
    sendMsg({ type: 'mouse_move', x, y });
    pendingMove = null;
  } else {
    pendingMove = { type: 'mouse_move', x, y };
  }
}
setInterval(() => {
  if (pendingMove) {
    lastMoveSent = Date.now();
    sendMsg(pendingMove);
    pendingMove = null;
  }
}, 16);

let touchLastY = null;
let twoFingerActive = false;
let wasTwoFinger = false;     // Đánh dấu đã dùng 2 ngón trong gesture này → không click
let twoFingerLastDist = null;
let twoFingerLastMid = null;
let twoFingerInitialized = false; // false = chưa có baseline → lần move đầu bỏ qua
let currentZoom = 1;
let panX = 0, panY = 0;
let fitW = 0, fitH = 0;   // kích thước vừa khít màn hình (zoom = 1)
let userZoomed = false;   // đánh dấu người dùng đã zoom tay, để fitCanvas không reset

const MIN_ZOOM = 0.5;     // cho phép zoom-out tối thiểu 50% (thu nhỏ tới 1/2)
const MAX_ZOOM = 15.0;

function clampPan() {
  // Khi zoom = 1 → reset pan về 0
  if (currentZoom <= 1 && !oneFingerDrag && !twoFingerActive) {
    panX = 0; panY = 0;
    currentZoom = 1;
    return;
  }
  const contentW = Math.max(fitW, 1) * currentZoom;
  const contentH = Math.max(fitH, 1) * currentZoom;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  let maxX, maxY;
  if (currentZoom > 1) {
    // Zoom in: canvas lớn hơn viewport → drag xem parts khác
    const overflowX = Math.max(0, contentW - vw);
    const overflowY = Math.max(0, contentH - vh);
    const margin = Math.max(200, Math.min(4000, overflowX * 0.5));
    maxX = overflowX + margin;
    maxY = overflowY + margin;
  } else {
    // Zoom out: canvas nhỏ hơn viewport → drag tự do trong viewport + extra
    const freeX = vw - contentW;
    const freeY = vh - contentH;
    maxX = Math.max(4000, freeX / 2 + 200);
    maxY = Math.max(4000, freeY / 2 + 200);
  }
  panX = Math.max(-maxX, Math.min(maxX, panX));
  panY = Math.max(-maxY, Math.min(maxY, panY));
}

  clampPan();

  if (wrapper) wrapper.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${currentZoom})`;

      if (e.touches.length === 1) {
        // KHÔNG inherit touchStartPos từ ngón còn lại — nếu ngón đó ở vùng đen
        // (ngoài canvas) thì sẽ gửi click/move sai vị trí.
        // Reset sạch: ngón còn lại phải bắt đầu gesture mới qua onTouchStart
        // (có kiểm tra bounds canvas).
        oneFingerDrag = false;
        touchStartPos = null;
        touchLastY = null;
        scrollMode = false;
        _scrollAccum = 0;
      } else {
        // Cả 2 ngón đều lift → reset wasTwoFinger cho gesture tiếp theo
        wasTwoFinger = false;
        oneFingerDrag = false;
        touchStartPos = null;
      }
    }
    return;
  }
  // Nếu vẫn còn >=2 ngón (hiếm) → không xử lý 1 ngón
  if (e.touches.length >= 2) return;
  if (!controlEnabled) return;

  // Thoát scroll mode khi TẤT CẢ ngón đều lift
  // Dùng timeout 300ms — nếu ngón chạm lại trước khi timeout → giữ scroll mode
  // (tránh lỡ tay mất contact rồi bị hiểu thành click khi chạm lại)
  if (e.touches.length === 0) {
    // Kết thúc scroll: đưa con trỏ chuột VỀ vị trí bắt đầu đặt tay để scroll
    // (chuột KHÔNG di chuyển khỏi điểm đặt tay ban đầu khi thao tác là scroll)
    if (scrollMode && e.changedTouches.length === 1 && touchStartPos) {
      const { x, y } = toServerCoords(touchStartPos.x, touchStartPos.y);
      sendMsg({ type: 'mouse_move', x, y });
    }
    if (scrollMode && !_scrollExitTimer) {
      _scrollExitTimer = setTimeout(() => {
        _scrollExitTimer = null;
        scrollMode = false;
        _scrollAccum = 0;
      }, 300);
    }
    if (wasTwoFinger) {
      wasTwoFinger = false;
      _blockRemote = false;
      longPressFired = false;
      touchStartPos = null;
    }
  }

  // Xử lý tap (click)
  // Chỉ gửi click khi: chạm trên canvas, KHÔNG đang trong scroll mode, không phải 2-finger, và không longPress
  // Scroll mode: finger đã di chuyển >2px → KHÔNG gửi click nữa (tránh scroll bị out of track)
  if (touchStartPos && e.changedTouches.length === 1 && !longPressFired && !wasTwoFinger) {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartPos.x;
    const dy = t.clientY - touchStartPos.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const elapsed = Date.now() - touchStartTime;
    const threshold = Math.max(36, 45 * currentZoom); // x3 ngưỡng gốc (12, 15*zoom): cho phép tap lệch vị trí rộng hơn
    const isTap = !scrollMode && dist < threshold && elapsed < 250;

    if (doubleTapSelecting) {
      // 2nd tap up: gửi mouse_up (hoàn thành press)
      const { x, y } = toServerCoords(t.clientX, t.clientY);
      sendMsg({ type: 'mouse_up', x, y, button: 1 });
      _mouseHeld = false;  // đã nhả → hết giữ nút
      if (_dtReleaseTimeout && isTap) {
        // Release nhanh → double-click hoàn thành
        clearTimeout(_dtReleaseTimeout);
        _dtReleaseTimeout = null;
        sendMsg({ type: 'mouse_click', x, y, button: 1 });
        lastTapTime = 0;
      }
      // Nếu _dtReleaseTimeout đã hết → chỉ mouse_up, không double-click (timeout press)
      if (_dtReleaseTimeout) { clearTimeout(_dtReleaseTimeout); _dtReleaseTimeout = null; }
      doubleTapSelecting = false;
    } else if (_mouseHeld) {
      // Đang giữ chuột (double-tap hold đã timeout) → tap này = NHẢ nút tại vị trí mới
      const { x, y } = toServerCoords(t.clientX, t.clientY);
      sendMsg({ type: 'mouse_move', x, y });
      sendMsg({ type: 'mouse_up', x, y, button: 1 });
      _mouseHeld = false;
    } else if (isTap) {
      // Single tap: KHÔNG gửi ngay — trễ SINGLE_TAP_DELAY_MS chờ xem có tap 2 không.
      // Nếu có tap 2 → onTouchStart hủy timer này (không gửi click đơn, thành double-tap).
      const { x, y } = toServerCoords(t.clientX, t.clientY);
      if (singleTapTimer) { clearTimeout(singleTapTimer); singleTapTimer = null; }
      pendingTapPos = { x, y };
      singleTapTimer = setTimeout(() => {
        singleTapTimer = null;
        if (pendingTapPos) {
          sendMsg({ type: 'mouse_click', x: pendingTapPos.x, y: pendingTapPos.y, button: 1 });
          pendingTapPos = null;
          lastTapTime = Date.now();
        }
      }, SINGLE_TAP_DELAY_MS);
    }
  }

  // Cleanup: đảm bảo doubleTapSelecting không bị treo
  if (doubleTapSelecting) doubleTapSelecting = false;
  if (_dtReleaseTimeout) { clearTimeout(_dtReleaseTimeout); _dtReleaseTimeout = null; }
  touchStartPos = null;
  touchLastY = null;
  oneFingerDrag = false;
}

// ── Button handlers ───────────────────────────────────────────
btnCtrl.addEventListener('click', () => {
  controlEnabled = !controlEnabled;
  btnCtrl.textContent = controlEnabled ? 'Control: ON' : 'Control: OFF';
  btnCtrl.classList.toggle('active', controlEnabled);
  if (canvas) canvas.style.cursor = controlEnabled ? 'crosshair' : 'default';
});
btnFullscreen.addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});
// btnFocusTarget.addEventListener('click', () => {  // Đã bỏ typing area

btnSettings.addEventListener('click', () => {
  settingsPanel.classList.toggle('show');

});
document.getElementById('btn-save-settings').addEventListener('click', () => {
  const url = document.getElementById('inp-host').value.trim();
  if (url) localStorage.setItem('server_url_h264wss', url);
  settingsPanel.classList.remove('show');
  controlPanel.classList.remove('show');
  arrowToggle.classList.remove('open');
  hideTimer = setTimeout(hideUI, AUTO_HIDE_DELAY);
  connect();
});
document.getElementById('btn-close-settings').addEventListener('click', () => {
  settingsPanel.classList.remove('show');
  controlPanel.classList.remove('show');
  arrowToggle.classList.remove('open');
  hideTimer = setTimeout(hideUI, AUTO_HIDE_DELAY);
});
let _lastKeyboardClickTime = 0;
btnKeyboard.addEventListener('click', () => {
  const now = Date.now();
  if (now - _lastKeyboardClickTime < 300) return;
  _lastKeyboardClickTime = now;
  hiddenInput.focus();
});
// Nút toggle bàn phím ảo — chỉ toggle panel, KHÔNG ảnh hưởng phone keyboard
document.getElementById('keyboard-toggle-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  const show = keyboardPanel.classList.toggle('show');
  document.getElementById('keyboard-toggle-btn').textContent = show ? '▲' : '▼';
  if (show) {
    clearTimeout(hideTimer);
  }
});
const MODIFIER_KEYS = ['ctrl', 'alt', 'shift', 'super'];
const comboDisplay = document.getElementById('combo-display');
let armedMods = new Set();
let modifierTimer = null;
const MODIFIER_TIMEOUT_MS = 7000;   // tự release + reset toggle modifier sau 7s

function armModifierTimer() {
  if (modifierTimer) clearTimeout(modifierTimer);
  modifierTimer = setTimeout(() => {
    modifierTimer = null;
    resetCombo();   // hết hạn → thả hết modifier đang giữ
  }, MODIFIER_TIMEOUT_MS);
}

function updateComboUI() {
  document.querySelectorAll('.key-btn').forEach(b => {
    const k = b.dataset.key;
    b.classList.toggle('armed', armedMods.has(k));
  });
  if (armedMods.size > 0) {
    const txt = [...armedMods].join(' + ');
    comboDisplay.textContent = `Đang giữ: ${txt}`;
  } else {
    comboDisplay.textContent = '';
  }
}

function resetCombo() {
  // Hủy timer tự release nếu có
  if (modifierTimer) { clearTimeout(modifierTimer); modifierTimer = null; }
  // Gửi key_up cho mọi modifier đang giữ (tránh kẹt phím ở server)
  armedMods.forEach(mod => sendMsg({ type: 'key_up', key: mod }));
  armedMods.clear();
  updateComboUI();
}

document.querySelectorAll('.key-btn').forEach(btn => {
  let repeatTimer = null;
  const sendKey = () => {
    const k = btn.dataset.key;
    if (MODIFIER_KEYS.includes(k)) return;   // modifier xử lý riêng ở pointerdown
    // Modifier đã giữ ở server → gửi phím trần, tổ hợp tự động hoạt động
    sendMsg({ type: 'key_press', key: k });
  };
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const k = btn.dataset.key;
    // Modifier: toggle on/off — gửi key_down/key_up tới server ngay
    if (MODIFIER_KEYS.includes(k)) {
      if (armedMods.has(k)) {
        // Đang bật → tắt: thả modifier ở server
        armedMods.delete(k);
        sendMsg({ type: 'key_up', key: k });
      } else {
        // Đang tắt → bật: giữ modifier ở server
        armedMods.add(k);
        sendMsg({ type: 'key_down', key: k });
      }
      updateComboUI();
      armModifierTimer();
      return;
    }
    sendKey();
    if (k !== 'Return') {   // Return không auto-repeat (tránh chạy lệnh nhiều lần)
      repeatTimer = setInterval(sendKey, 60);   // giữ nút → lặp gửi
    }
  });
  const stopRepeat = () => {
    if (repeatTimer) { clearInterval(repeatTimer); repeatTimer = null; }
    // Modifier: KHÔNG thả khi pointerup (toggle xử lý riêng)
  };
  btn.addEventListener('pointerup', stopRepeat);
  btn.addEventListener('pointerleave', stopRepeat);
  btn.addEventListener('pointercancel', stopRepeat);
});
// ── Hidden input: mobile keyboard nhập trực tiếp → gửi từng ký tự ──
let _prevInputValue = '';
let isComposing = false;

hiddenInput.addEventListener('keydown', (e) => {
  e.stopPropagation();
  if (isComposing) return;
  // Modifier keys từ phím cứng phone → IGNORE
  if (MODIFIER_KEYS.includes(e.key.toLowerCase())) return;
  // Enter
  if (e.key === 'Enter') {
    e.preventDefault();
    sendMsg({ type: 'key_press', key: 'Return' });
    hiddenInput.value = '';
    _prevInputValue = '';
    return;
  }
  // BackSpace → preventDefault để input handler không detect deletion
  if (e.key === 'Backspace') {
    e.preventDefault();
    sendMsg({ type: 'key_press', key: 'BackSpace' });
    return;
  }
  // Special keys
  const SPECIAL_KEYS = {'ArrowUp':'Up','ArrowDown':'Down','ArrowLeft':'Left','ArrowRight':'Right','Tab':'Tab','Delete':'Delete','Escape':'Escape'};
  if (SPECIAL_KEYS[e.key]) {
    sendMsg({ type: 'key_press', key: SPECIAL_KEYS[e.key] });
    return;
  }
  // Printable chars → KHÔNG gửi ở đây, để input handler gửi text nguyên văn
});

hiddenInput.addEventListener('focus', () => {
  clearTimeout(hideTimer);
  _prevInputValue = hiddenInput.value;
  // Ngăn browser tự scroll khi focus input (mobile)
  window.scrollTo(0, 0);
  document.body.scrollTop = 0;
  document.documentElement.scrollTop = 0;
});

hiddenInput.addEventListener('blur', () => {
  // Blur → ẩn keyboard panel
});

// Input event: nhận text từ mobile keyboard → gửi nguyên văn lên server
hiddenInput.addEventListener('input', (e) => {
  clearTimeout(hideTimer);
  if (isComposing) return;
  const current = hiddenInput.value;
  const prev = _prevInputValue;
  if (current.length > prev.length) {
    const added = current.slice(prev.length);
    if (armedMods.size > 0 && added.length === 1) {
      // Modifier đang giữ ở server → gửi phím trần, server tự kèm modifier qua _send_key_with_modifiers
      sendMsg({ type: 'key_press', key: added });
    } else {
      sendMsg({ type: 'key_type', text: added });
    }
  } else if (current.length < prev.length) {
    const count = prev.length - current.length;
    for (let i = 0; i < count; i++) {
      sendMsg({ type: 'key_press', key: 'BackSpace' });
    }
  }
  hiddenInput.value = '';
  _prevInputValue = '';
  setTimeout(() => hiddenInput.focus(), 0);
});

// Composition handlers ( Vietnamese Telex trên mobile )
hiddenInput.addEventListener('compositionstart', () => { isComposing = true; });
hiddenInput.addEventListener('compositionend', (e) => {
  isComposing = false;
  // KHÔNG dispatch synthetic input event — browser sẽ tự fire input event sau compositionend
});
// let isComposing = false;  // Đã khai báo ở trên

function focusRemoteTarget() {
  // Click vào vị trí con trỏ cuối để focus ô nhập trên máy remote
  // (xdotool type chỉ gõ vào cửa sổ đang có focus)
  sendMsg({ type: 'mouse_click', x: remoteCursor.x, y: remoteCursor.y, button: 1 });
}

document.addEventListener('keydown', (e) => {
  if (!controlEnabled) return;
  if (e.target === hiddenInput) return;
  e.preventDefault();
  let key = e.key;
  if (key === ' ') key = 'space';
  else if (key === 'ArrowUp') key = 'Up';
  else if (key === 'ArrowDown') key = 'Down';
  else if (key === 'ArrowLeft') key = 'Left';
  else if (key === 'ArrowRight') key = 'Right';
  else if (key === 'Escape') key = 'Escape';
  else if (key === 'Enter') key = 'Return';
  else if (key === 'Backspace') key = 'BackSpace';
  else if (key === 'Delete') key = 'Delete';
  else if (key === 'Tab') key = 'Tab';
  if (e.ctrlKey && key !== 'ctrl') key = 'ctrl+' + key;
  else if (e.altKey && key !== 'alt') key = 'alt+' + key;
  else if (e.shiftKey && key !== 'shift') key = 'shift+' + key;
  else if (e.metaKey && key !== 'super') key = 'super+' + key;
  sendMsg({ type: 'key_press', key });
});

// ── Heartbeat + Watchdog chống WS "chết thầm" khi tắt màn hình ──
const IDLE_RECONNECT_MS = 180000;   // 3 phút: không có dữ liệu → reconnect
// 1) Heartbeat: gửi ping định kỳ (server echo pong) để giữ kết nối "có hoạt động"
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ping' }));
}, 15000);
// 2) Watchdog: nếu đã OPEN nhưng >3 phút không nhận gì → ép đóng để onclose reconnect
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN && Date.now() - lastDataTime > IDLE_RECONNECT_MS) {
    console.log('[WS] Idle >3min, force reconnect');
    ws.close();  // onclose sẽ gọi connect()
  }
}, 10000);
// 3) Khi bật lại màn hình: ping nhanh, nếu 5s không có pong/data → reconnect ngay
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  _reconnectAttempt = 0;   // reset backoff để nối lại nhanh nhất
  // Reset toàn bộ gesture state — khi khóa màn hình/chuyển app giữa lúc pinch 2 ngón,
  // touchend/touchcancel KHÔNG fire → twoFingerActive/_blockRemote kẹt true → chặn hết touch
  twoFingerActive = false;
  wasTwoFinger = false;
  _blockRemote = false;
  gestureActive = false;
  scrollMode = false;
  _scrollAccum = 0;
  doubleTapSelecting = false;
  oneFingerDrag = false;
  scrollStarted = false;
  longPressFired = false;
  touchStartPos = null;
  touchLastY = null;
  twoFingerLastDist = null;
  twoFingerLastMid = null;
  twoFingerInitialized = false;
  if (singleTapTimer) { clearTimeout(singleTapTimer); singleTapTimer = null; }
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  if (_scrollExitTimer) { clearTimeout(_scrollExitTimer); _scrollExitTimer = null; }
  if (_dtReleaseTimeout) { clearTimeout(_dtReleaseTimeout); _dtReleaseTimeout = null; }
  pendingTapPos = null;
  // Đang giữ nút chuột → nhả dự phòng (tránh kẹt nút ở server)
  if (_mouseHeld) {
    sendMsg({ type: 'mouse_up', x: 0, y: 0, button: 1 });
    _mouseHeld = false;
  }
  // Resume audio nếu bị suspend do tab ẩn (tránh mất âm thanh khi quay lại)
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
  // Audio WS cũng có thể chết khi tab ẩn → nối lại audio nếu chưa sẵn sàng
  if (!audioWs || audioWs.readyState > 1) {
    if (document.hidden === false) connectAudio();
  }
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'ping' }));
    const t = Date.now();
    setTimeout(() => {
      if (ws && ws.readyState === WebSocket.OPEN && t - lastDataTime > 5000) {
        console.log('[WS] Visible but stale, force reconnect');
        ws.close();  // onclose sẽ gọi scheduleReconnect
      }
    }, 5000);
  } else if (!_wsClosing) {
    // WS đã đóng/failed — reconnect ngay
    if (_connectTimer) { clearTimeout(_connectTimer); _connectTimer = null; }
    scheduleReconnect(500);
  } else {
    // _wsClosing kẹt (onclose chưa fire) — ép reset để không rơi vào đen mãi
    _wsClosing = false;
    if (_wsCloseRescue) { clearTimeout(_wsCloseRescue); _wsCloseRescue = null; }
    scheduleReconnect(500);
  }
});

connect();
</script>
